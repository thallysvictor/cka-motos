<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CKA Motos | Oficina de motos</title>
<meta name="description" content="Oficina de motos com revisão, mecânica, elétrica e freios. Orçamento claro antes de começar.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
:root{--bg:#070607;--bg2:#0e0c0d;--ink:#f1eeee;--mute:#948d8e;--line:#2a2425;--red:#d4202f;--pill:#e4e1e1;--pill-ink:#111;
--sans:'Inter Tight','Helvetica Neue',Arial,sans-serif;--serif:'Instrument Serif',Georgia,'Times New Roman',serif;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
em{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:.005em}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.pill{display:inline-flex;align-items:center;justify-content:center;background:var(--pill);color:var(--pill-ink);font:600 15px var(--sans);padding:14px 26px;border-radius:999px;text-decoration:none;border:0;transition:transform .2s,background .2s}
.pill:hover{transform:translateY(-2px);background:#fff}
.pill.o{background:transparent;color:var(--ink);border:1px solid #4a4244}
.pill.o:hover{background:#ffffff14}
/* loader */
#ld{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;transition:transform .7s cubic-bezier(.77,0,.18,1)}
#ld.out{transform:translateY(-100%)}
#ld div{text-align:center;font:600 20px var(--sans);letter-spacing:.3em}
#ld i{display:block;height:1px;margin:16px auto 0;background:var(--ink);width:0;animation:ln .9s .1s forwards cubic-bezier(.6,0,.2,1)}
@keyframes ln{to{width:120px}}
/* header */
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;mix-blend-mode:difference}
.nav{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;height:64px;padding:0 24px;font-size:13px;font-weight:500}
.nav a{text-decoration:none;color:#fff}
.nav .l a{margin-right:22px}.nav .r{text-align:right}
.logo{font-weight:700;letter-spacing:.28em;font-size:14px}
/* hero */
.hero{position:relative;height:100svh;min-height:600px}
.hst{position:relative;height:100%;overflow:hidden}
.glow{position:absolute;border-radius:50%;filter:blur(80px);will-change:transform}
.g1{width:46vw;height:46vw;left:-8vw;top:30vh;background:radial-gradient(circle,#d4202f88,transparent 65%);animation:dr 14s ease-in-out infinite alternate}
.g2{width:38vw;height:38vw;right:-6vw;top:34vh;background:radial-gradient(circle,#ffffff26,transparent 65%);animation:dr 18s ease-in-out infinite alternate-reverse}
@keyframes dr{to{transform:translate(8vw,6vh) scale(1.2)}}
.hst .wrap{position:absolute;left:0;right:0;top:0;padding-top:92px;z-index:3;pointer-events:none}
h1{font:600 clamp(38px,6vw,88px)/.95 var(--sans);letter-spacing:-.035em;margin:0;max-width:12ch}
h1 em{font-size:1.04em;letter-spacing:-.01em}
.row{display:flex;gap:12px;flex-wrap:wrap}
.bike{position:absolute;left:50%;bottom:132px;translate:-50% 0;width:min(98vw,calc((100svh - 380px)*1.91));height:auto;overflow:visible;z-index:2}
.sp{transform-box:fill-box;transform-origin:center}
.parts.hl .part{opacity:.2;transition:opacity .35s,filter .35s}
.parts.hl .part.on{opacity:1;filter:drop-shadow(0 0 16px #d4202fcc)}
#cap{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:40px 0 calc(22px + env(safe-area-inset-bottom,0px));background:linear-gradient(transparent,#070607 45%)}
#cap .wrap{position:static;padding-top:0;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;pointer-events:auto}
#cap small{color:var(--mute);font-size:13px;display:block;min-height:1.4em}
#cap h3{font:italic 400 clamp(28px,4vw,46px)/1.05 var(--serif);margin:2px 0 6px}
#cap p{margin:0;color:#c9c3c4;max-width:46ch;font-size:15px}
.stats{display:flex;gap:44px;margin-top:44px;padding-top:22px;border-top:1px solid #ffffff22;max-width:560px}
.stats b{display:block;font-weight:600;font-size:15px}.stats span{color:var(--mute);font-size:14px}
/* sections */
.sec{padding:130px 0}
.lbl{font-size:13px;color:var(--mute);margin-bottom:22px}
h2{font:600 clamp(36px,5.6vw,80px)/1 var(--sans);letter-spacing:-.03em;margin:0;text-transform:uppercase}
h2 em{text-transform:none;font-size:1.06em;letter-spacing:0}
.two{display:grid;grid-template-columns:1.15fr .85fr;gap:60px;align-items:end}
.two p{color:#c9c3c4;margin:0 0 20px}
.lnk{font-size:14px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink);padding-bottom:3px}
/* horizontal */
.pin{position:relative;padding:110px 0 70px}
.stick{display:block}
.stick .wrap{margin-bottom:34px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}
.nv{display:flex;gap:10px}
.nv button{width:46px;height:46px;border-radius:50%;border:1px solid #4a4244;background:transparent;color:var(--ink);font:500 20px var(--sans);cursor:pointer;transition:background .2s}
.nv
